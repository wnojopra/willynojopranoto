<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 567" width="1024" height="567">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d263e"/>
      <stop offset="1" stop-color="#061320"/>
    </linearGradient>
    <radialGradient id="dialFace" cx="512" cy="390" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#ebe4d1"/>
    </radialGradient>
    <radialGradient id="redKnob" cx="38%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="0.55" stop-color="#d62828"/>
      <stop offset="1" stop-color="#9e1919"/>
    </radialGradient>
    <clipPath id="semi">
      <path d="M 272 390 A 240 240 0 0 1 752 390 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="567" fill="url(#bg)"/>

  <!-- Top rainbow stripe bar -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="146" height="8" fill="#82d682"/>
    <rect x="146" y="0" width="146" height="8" fill="#fbf7ec"/>
    <rect x="292" y="0" width="146" height="8" fill="#68b5e8"/>
    <rect x="438" y="0" width="148" height="8" fill="#f2a2ba"/>
    <rect x="586" y="0" width="146" height="8" fill="#f26430"/>
    <rect x="732" y="0" width="146" height="8" fill="#f7c942"/>
    <rect x="878" y="0" width="146" height="8" fill="#82d682"/>
  </g>

  <!-- Score chips -->
  <g transform="translate(335, 36)">
    <rect width="165" height="36" rx="18" fill="#102a45" stroke="#f26430" stroke-width="2"/>
    <circle cx="20" cy="18" r="6" fill="#f26430"/>
    <text x="36" y="23" fill="#fbf7ec" font-family="sans-serif" font-size="14" font-weight="700">Left Brain</text>
    <rect x="130" y="6" width="28" height="24" rx="12" fill="#f26430"/>
    <text x="144" y="23" fill="#061320" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">8</text>
  </g>
  <g transform="translate(520, 36)">
    <rect width="165" height="36" rx="18" fill="#102a45" stroke="#f7c942" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#f7c942"/>
    <text x="36" y="23" fill="#c9d6e3" font-family="sans-serif" font-size="14" font-weight="700">Right Brain</text>
    <rect x="130" y="6" width="28" height="24" rx="12" fill="#173758"/>
    <text x="144" y="23" fill="#fbf7ec" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">6</text>
  </g>

  <!-- Clue title -->
  <text x="512" y="114" fill="#fbf7ec" font-family="sans-serif" font-size="28" font-weight="800" text-anchor="middle">
    Clue: “Warm Soup”
  </text>

  <!-- White Scalloped Outer Wheel -->
  <path d="M 260 390 A 252 252 0 0 1 764 390 Z" fill="#fbf8ef"/>
  <path d="M 266 390 A 246 246 0 0 1 758 390 Z" fill="#0d2b45"/>

  <!-- Dial Face & Wedges -->
  <g clip-path="url(#semi)">
    <path d="M 272 390 A 240 240 0 0 1 752 390 Z" fill="url(#dialFace)"/>
    <path d="M 352 390 A 160 160 0 0 1 672 390" fill="none" stroke="#0d2b45" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M 432 390 A 80 80 0 0 1 592 390" fill="none" stroke="#0d2b45" stroke-opacity="0.08" stroke-width="2"/>

    <!-- Target wedges rotated -18 deg (matching the photo) -->
    <g transform="rotate(-18 512 390)">
      <path d="M 512 390 L 418 166 A 242 242 0 0 1 454 155 Z" fill="#f7c942"/>
      <path d="M 512 390 L 454 155 A 242 242 0 0 1 493 149 Z" fill="#f26b38"/>
      <path d="M 512 390 L 493 149 A 242 242 0 0 1 531 149 Z" fill="#70b7e8"/>
      <path d="M 512 390 L 531 149 A 242 242 0 0 1 570 155 Z" fill="#f26b38"/>
      <path d="M 512 390 L 570 155 A 242 242 0 0 1 606 166 Z" fill="#f7c942"/>
      <text x="442" y="196" fill="#0d2b45" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">2</text>
      <text x="477" y="186" fill="#0d2b45" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">3</text>
      <text x="512" y="182" fill="#0d2b45" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">4</text>
      <text x="547" y="186" fill="#0d2b45" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">3</text>
      <text x="582" y="196" fill="#0d2b45" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">2</text>
    </g>
  </g>

  <rect x="256" y="388" width="512" height="18" rx="9" fill="#0d2b45"/>

  <!-- Red Needle rotated -16 deg -->
  <g transform="rotate(-16 512 390)">
    <line x1="512" y1="390" x2="512" y2="174" stroke="#e02424" stroke-width="7" stroke-linecap="round"/>
    <circle cx="512" cy="174" r="8" fill="#e02424"/>
  </g>
  <circle cx="512" cy="390" r="28" fill="url(#redKnob)" stroke="#8c1414" stroke-width="2"/>
  <circle cx="512" cy="390" r="19" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Two-tone Yellow / Blush Pink Spectrum Card -->
  <g transform="translate(262, 434)">
    <rect width="242" height="86" rx="14" fill="#f7d047" stroke="#fbf7ec" stroke-width="3"/>
    <text x="22" y="32" fill="#0d2b45" opacity="0.75" font-family="sans-serif" font-size="16" font-weight="900">←</text>
    <text x="22" y="64" fill="#0a1d30" font-family="sans-serif" font-size="25" font-weight="800">Cold</text>

    <rect x="242" width="16" height="86" fill="#fbf7ec"/>

    <rect x="258" width="242" height="86" rx="14" fill="#f7b2c4" stroke="#fbf7ec" stroke-width="3"/>
    <text x="478" y="32" fill="#0d2b45" opacity="0.75" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="end">→</text>
    <text x="478" y="64" fill="#0a1d30" font-family="sans-serif" font-size="25" font-weight="800" text-anchor="end">Hot</text>
  </g>
</svg>
