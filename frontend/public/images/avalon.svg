<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 567" width="1024" height="567">
  <defs>
    <!-- Autumn forest & misty stone background matching the physical Avalon Score Tableau -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b210e"/>
      <stop offset="38%" stop-color="#6b421d"/>
      <stop offset="70%" stop-color="#3a3329"/>
      <stop offset="100%" stop-color="#1b2019"/>
    </linearGradient>
    <radialGradient id="sun" cx="32%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="95%" r="65%">
      <stop offset="0%" stop-color="#3e1f12" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#1f2717" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#0d110c" stop-opacity="0.96"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5bf"/>
      <stop offset="45%" stop-color="#e5b84b"/>
      <stop offset="85%" stop-color="#9e6b12"/>
      <stop offset="100%" stop-color="#f3d27a"/>
    </linearGradient>
    <radialGradient id="well" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffebc8" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#0f0c08" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <radialGradient id="fifth" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#991b1b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.95"/>
    </radialGradient>
    <path id="qarc3" d="M 454,232 A 58,58 0 0,1 570,232"/>
    <path id="qarc4" d="M 629,232 A 58,58 0 0,1 745,232"/>
    <path id="qarc5" d="M 804,232 A 58,58 0 0,1 920,232"/>
    <path id="twofail" d="M 604,225 A 86,86 0 0,1 770,225"/>
  </defs>

  <rect width="1024" height="567" fill="url(#sky)"/>
  <rect width="1024" height="567" fill="url(#sun)"/>

  <!-- Forest trunks -->
  <g opacity="0.36" fill="#1a1007">
    <rect x="48" y="0" width="20" height="390"/>
    <rect x="115" y="0" width="14" height="370"/>
    <rect x="180" y="0" width="28" height="400"/>
    <rect x="380" y="0" width="22" height="380"/>
    <rect x="910" y="0" width="24" height="390"/>
  </g>

  <!-- Stone Castle Watchtower -->
  <g transform="translate(625, 95)" opacity="0.58">
    <path d="M10,275 L18,32 L0,32 L0,8 L24,8 L24,20 L44,20 L44,8 L68,8 L68,20 L88,20 L88,8 L112,8 L112,20 L132,20 L132,8 L156,8 L156,20 L176,20 L176,8 L200,8 L200,32 L184,32 L192,275 Z" fill="#2d2620" stroke="#171310" stroke-width="3"/>
    <path d="M88,65 C88,50 112,50 112,65 V105 H88 Z" fill="#0d0b09" stroke="#574a3d" stroke-width="2"/>
  </g>

  <path d="M0,365 Q512,338 1024,368 L1024,567 L0,567 Z" fill="url(#ground)"/>
  <rect x="14" y="14" width="996" height="539" rx="18" fill="none" stroke="rgba(218, 185, 120, 0.45)" stroke-width="3"/>

  <!-- Top Chiseled Box Title -->
  <text x="512" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="4" fill="#e8e0cf">DON ESKRIDGE'S THE RESISTANCE</text>
  <text x="512" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="74" font-weight="900" letter-spacing="8" fill="url(#gold)" stroke="#241503" stroke-width="2">AVALON</text>

  <!-- Quest 1: Red Evil Starburst Token -->
  <g transform="translate(162, 255)">
    <circle r="72" fill="#692018" stroke="#c9b896" stroke-width="3"/>
    <polygon points="0,-58 14,-22 50,-36 24,-4 56,18 18,22 22,58 -4,26 -36,50 -22,14 -58,0 -22,-14 -50,-36 -14,-22" fill="#d6c7a9" stroke="#4a3525" stroke-width="2"/>
    <circle r="24" fill="#b91c1c" stroke="#e7dec8" stroke-width="3"/>
  </g>

  <!-- Quest 2: Blue/Gold Arthur Starburst Token -->
  <g transform="translate(337, 255)">
    <circle r="72" fill="#232933" stroke="#9aa5b4" stroke-width="3"/>
    <polygon points="0,-58 14,-22 50,-36 24,-4 56,18 18,22 22,58 -4,26 -36,50 -22,14 -58,0 -22,-14 -50,-36 -14,-22" fill="url(#gold)" stroke="#5c3d04" stroke-width="2"/>
    <circle r="24" fill="#2563eb" stroke="#fef08a" stroke-width="3"/>
  </g>

  <!-- Quest 3 Open Well -->
  <g>
    <circle cx="512" cy="255" r="72" fill="url(#well)" stroke="#facc15" stroke-width="3.5"/>
    <text fill="#f5efe0" font-family="Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">
      <textPath href="#qarc3" startOffset="50%" text-anchor="middle">Quest 3</textPath>
    </text>
    <text x="512" y="284" text-anchor="middle" fill="#f8f5ec" stroke="#1c1610" stroke-width="2" font-family="Georgia, serif" font-size="68" font-weight="bold">3</text>
    <!-- Round Marker Shield Token -->
    <circle cx="560" cy="308" r="28" fill="#8c6724" stroke="#f3d88c" stroke-width="2.5"/>
    <path d="M560,290 L573,296 V308 C573,316 567,322 560,324 C553,322 547,316 547,308 V296 Z" fill="#fef08a" stroke="#5c3a08" stroke-width="1.5"/>
    <path d="M560,292 V322 M549,305 H571" stroke="#b91c1c" stroke-width="3.5"/>
  </g>

  <!-- Quest 4 Open Well with "Two fails required" -->
  <g>
    <text fill="#f8fafc" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="1.2">
      <textPath href="#twofail" startOffset="50%" text-anchor="middle">Two fails required</textPath>
    </text>
    <circle cx="687" cy="255" r="72" fill="url(#well)" stroke="rgba(235, 215, 175, 0.6)" stroke-width="2.2"/>
    <text fill="#f5efe0" font-family="Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">
      <textPath href="#qarc4" startOffset="50%" text-anchor="middle">Quest 4</textPath>
    </text>
    <text x="687" y="284" text-anchor="middle" fill="#f8f5ec" stroke="#1c1610" stroke-width="2" font-family="Georgia, serif" font-size="68" font-weight="bold">4</text>
    <circle cx="735" cy="308" r="26" fill="rgba(25, 32, 24, 0.72)" stroke="rgba(215, 198, 160, 0.5)" stroke-width="2"/>
  </g>

  <!-- Quest 5 Open Well -->
  <g>
    <circle cx="862" cy="255" r="72" fill="url(#well)" stroke="rgba(235, 215, 175, 0.6)" stroke-width="2.2"/>
    <text fill="#f5efe0" font-family="Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">
      <textPath href="#qarc5" startOffset="50%" text-anchor="middle">Quest 5</textPath>
    </text>
    <text x="862" y="284" text-anchor="middle" fill="#f8f5ec" stroke="#1c1610" stroke-width="2" font-family="Georgia, serif" font-size="68" font-weight="bold">4</text>
    <circle cx="910" cy="308" r="26" fill="rgba(25, 32, 24, 0.72)" stroke="rgba(215, 198, 160, 0.5)" stroke-width="2"/>
  </g>

  <!-- Vote Track Plaque -->
  <rect x="28" y="362" width="174" height="36" rx="10" fill="rgba(18, 20, 16, 0.88)" stroke="rgba(215, 198, 160, 0.55)" stroke-width="2"/>
  <text x="115" y="386" text-anchor="middle" fill="#f5efe0" font-family="Georgia, serif" font-size="16" font-weight="bold" letter-spacing="2">VOTE TRACK</text>

  <!-- Vote Track 1..5 -->
  <g transform="translate(0, 455)">
    <!-- 1 with Purple Pouch Token -->
    <circle cx="145" cy="0" r="46" fill="#e5dcc8" stroke="#eee5d3" stroke-width="2.5"/>
    <path d="M135,-18 L155,-18 L150,-10 L140,-10 Z" fill="#7e22ce" stroke="#3b0764" stroke-width="1.5"/>
    <path d="M138,-10 C128,-4 126,12 132,18 C136,22 154,22 158,18 C164,12 162,-4 152,-10 Z" fill="#7e22ce" stroke="#3b0764" stroke-width="1.5"/>

    <circle cx="275" cy="0" r="46" fill="url(#well)" stroke="rgba(225, 210, 180, 0.55)" stroke-width="2.2"/>
    <text x="275" y="16" text-anchor="middle" fill="#f8f5ec" font-family="Georgia, serif" font-size="44" font-weight="bold">2</text>

    <circle cx="405" cy="0" r="46" fill="url(#well)" stroke="rgba(225, 210, 180, 0.55)" stroke-width="2.2"/>
    <text x="405" y="16" text-anchor="middle" fill="#f8f5ec" font-family="Georgia, serif" font-size="44" font-weight="bold">3</text>

    <circle cx="535" cy="0" r="46" fill="url(#well)" stroke="rgba(225, 210, 180, 0.55)" stroke-width="2.2"/>
    <text x="535" y="16" text-anchor="middle" fill="#f8f5ec" font-family="Georgia, serif" font-size="44" font-weight="bold">4</text>

    <circle cx="665" cy="0" r="46" fill="url(#fifth)" stroke="#f87171" stroke-width="3"/>
    <text x="665" y="16" text-anchor="middle" fill="#f8f5ec" font-family="Georgia, serif" font-size="44" font-weight="bold">5</text>
  </g>

  <!-- Bottom Right Plaque -->
  <rect x="740" y="430" width="250" height="66" rx="12" fill="rgba(16, 14, 12, 0.84)" stroke="rgba(215, 198, 160, 0.48)" stroke-width="2"/>
  <text x="762" y="458" fill="#f5efe0" font-family="Georgia, serif" font-size="20" font-weight="bold">7 Players ••••</text>
  <text x="776" y="482" fill="#e7d8b9" font-family="Georgia, serif" font-size="18">3 Minions of Mordred</text>
</svg>
