<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 567" width="1024" height="567">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="25%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="75%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="567" fill="url(#bg)"/>
  <rect width="1024" height="567" fill="url(#blueGlow)"/>
  <rect width="1024" height="567" fill="url(#redGlow)"/>

  <!-- Ornamental border -->
  <rect x="28" y="28" width="968" height="511" rx="22" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Split Crest in Center -->
  <g transform="translate(442, 48)">
    <path d="M70 6 L130 28 V76 C130 114 103 140 70 152 C37 140 10 114 10 76 V28 Z" fill="#0b1324" stroke="url(#gold)" stroke-width="4"/>
    <path d="M70 12 V146 C41 135 16 111 16 76 V32 Z" fill="#1d4ed8" fill-opacity="0.5"/>
    <path d="M70 12 L124 32 V76 C124 111 99 135 70 146 Z" fill="#b91c1c" fill-opacity="0.5"/>
    <path d="M70 22 V134 M45 46 H95" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 64 H90 L84 92 C81 103 59 103 56 92 Z" fill="url(#gold)"/>
  </g>

  <!-- Title -->
  <text x="512" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="bold" letter-spacing="10" fill="url(#gold)">AVALON</text>
  <text x="512" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#cbd5e1">HIDDEN LOYALTY · DEDUCTION · DECEPTION</text>

  <!-- 5 Quest Tableau Circles -->
  <g transform="translate(152, 326)">
    <!-- Quest 1: Good -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="124" height="148" rx="16" fill="#172554" fill-opacity="0.7" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="62" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#93c5fd">QUEST 1</text>
      <circle cx="62" cy="78" r="34" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2.5"/>
      <text x="62" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#eff6ff">SUCCESS</text>
      <text x="62" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">2 Knights</text>
    </g>
    <!-- Quest 2: Evil -->
    <g transform="translate(148, 0)">
      <rect x="0" y="0" width="124" height="148" rx="16" fill="#450a0a" fill-opacity="0.7" stroke="#ef4444" stroke-width="2.5"/>
      <text x="62" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#fca5a5">QUEST 2</text>
      <circle cx="62" cy="78" r="34" fill="#7f1d1d" stroke="#f87171" stroke-width="2.5"/>
      <text x="62" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#fef2f2">FAILED</text>
      <text x="62" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">3 Knights</text>
    </g>
    <!-- Quest 3: Good -->
    <g transform="translate(296, 0)">
      <rect x="0" y="0" width="124" height="148" rx="16" fill="#172554" fill-opacity="0.7" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="62" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#93c5fd">QUEST 3</text>
      <circle cx="62" cy="78" r="34" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2.5"/>
      <text x="62" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#eff6ff">SUCCESS</text>
      <text x="62" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">3 Knights</text>
    </g>
    <!-- Quest 4: Active -->
    <g transform="translate(444, 0)">
      <rect x="0" y="0" width="124" height="148" rx="16" fill="#0f172a" stroke="#fde047" stroke-width="3"/>
      <text x="62" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#fef08a">QUEST 4</text>
      <circle cx="62" cy="78" r="34" fill="#090d16" stroke="url(#gold)" stroke-width="2.5"/>
      <text x="62" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#fef08a">4</text>
      <text x="62" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fde047">2 Fails Req.</text>
    </g>
    <!-- Quest 5 -->
    <g transform="translate(592, 0)">
      <rect x="0" y="0" width="124" height="148" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#475569" stroke-width="2"/>
      <text x="62" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#94a3b8">QUEST 5</text>
      <circle cx="62" cy="78" r="34" fill="#090d16" stroke="#64748b" stroke-width="2"/>
      <text x="62" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#e2e8f0">4</text>
      <text x="62" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">4 Knights</text>
    </g>
  </g>
</svg>
